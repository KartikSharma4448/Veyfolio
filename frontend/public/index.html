<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#000000" />
        <link rel="icon" type="image/png" href="%PUBLIC_URL%/veyfolio-logo.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/veyfolio-logo.png" />

        <!-- Fallback SEO meta tags (overridden by SEOHead component at runtime) -->
        <meta name="description" content="Create your resume with two professional templates, live preview, projects, optional AI suggestions, job keyword checks, and PDF export. No signup required." />
        <meta name="keywords" content="resume builder, CV maker, AI resume, professional resume, ATS optimization" />

        <!-- Open Graph meta tags -->
        <meta property="og:title" content="Veyfolio Resume Builder | Create Your CV Online" />
        <meta property="og:description" content="Build your resume with live preview, projects, two professional templates and PDF export." />
        <meta property="og:image" content="https://veyfolio.thekartiksharma.in/veyfolio-social-preview.png" />
        <meta property="og:site_name" content="Veyfolio" />
        <meta property="og:type" content="website" />

        <!-- Twitter Card meta tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Veyfolio Resume Builder | Create Your CV Online" />
        <meta name="twitter:description" content="Build your resume with live preview, projects, two professional templates and PDF export." />
        <meta name="twitter:image" content="https://veyfolio.thekartiksharma.in/veyfolio-social-preview.png" />

        <title>Veyfolio Resume Builder | Create Your CV Online</title>

        <!-- Google Analytics 4: only loads if REACT_APP_GA4_ID is set at build time -->
        <script>
            (function() {
                var gaId = '%REACT_APP_GA4_ID%';
                // CRA replaces %REACT_APP_GA4_ID% with the actual value at build time.
                // If not set, it remains as the literal placeholder string.
                if (!gaId || gaId === '' || gaId.indexOf('REACT_APP_GA4_ID') !== -1) return;

                var script = document.createElement('script');
                script.async = true;
                script.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
                document.head.appendChild(script);

                window.dataLayer = window.dataLayer || [];
                window.gtag = function() { window.dataLayer.push(arguments); };
                window.gtag('js', new Date());
                window.gtag('config', gaId);
            })();
        </script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
